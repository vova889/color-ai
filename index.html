<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейро-Генератор Палитр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 Нейро-Генератор Палитр</h1>
        <p class="subtitle">Опиши настроение — получи цветовую палитру</p>
        
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Например: закат на море, ночь в лесу...">
            <button onclick="generatePalette()">Сгенерировать</button>
        </div>
        
        <button onclick="randomMood()" class="lucky-btn">🎲 Мне повезёт</button>
        
        <div id="theme" class="theme"></div>
        
        <div id="palette" class="palette">
        </div>
        
        <p class="hint">Кликни по цвету, чтобы скопировать его код</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
