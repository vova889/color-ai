<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейро-Генератор Палитр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхняя секция с генератором -->
    <div class="hero">
        <div class="container">
            <h1>🎨 Нейро-Генератор Палитр</h1>
            <p class="subtitle">Опиши настроение — получи цветовую палитру</p>
            
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Например: закат на море, осенний лес...">
                <button id="generateBtn">Сгенерировать</button>
            </div>
            
            <div id="palette" class="palette"></div>
            
            <p class="hint">Кликни по цвету, чтобы скопировать его код</p>
        </div>
    </div>

    <!-- Нижняя секция с галереей -->
    <div class="gallery">
        <h2>Вдохновение</h2>
        <p>Популярные палитры</p>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <div class="overlay">Закат</div>
            </div>
            <div class="gallery-item">
                <div class="overlay">Лес</div>
            </div>
            <div class="gallery-item">
                <div class="overlay">Океан</div>
            </div>
            <div class="gallery-item">
                <div class="overlay">Горы</div>
            </div>
            <div class="gallery-item">
                <div class="overlay">Пустыня</div>
            </div>
            <div class="gallery-item">
                <div class="overlay">Космос</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
